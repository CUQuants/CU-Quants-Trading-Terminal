services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Plain http on localhost: the session cookie can't be Secure.
      - TERMINAL_COOKIE_SECURE=false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      no_cache: true
    ports:
      - "3000:5173"
    volumes:
      - ./frontend/src:/app/src
    environment:
      # The browser calls /api on the Vite server, which proxies to the
      # backend container (same-origin, so the session cookie works).
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
