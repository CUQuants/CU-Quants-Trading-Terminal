[project]
name = "cu-quants-trading-terminal-backend"
version = "0.1.0"
description = "FastAPI backend for the CU Quants Trading Terminal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "websockets>=14.0",
    "cuq-proxy-client[websocket]",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.uv.sources]
# Installed straight from GitHub, pinned to a commit on main. To upgrade, bump
# `rev` and run `uv lock`. To hack on the SDK locally, temporarily swap in:
#   cuq-proxy-client = { path = "../../proxy-client", editable = true }
cuq-proxy-client = { git = "https://github.com/CUQuants/proxy-client.git", rev = "8d304909872c15341b8a27e07a5bc0ff1fc0bb0d" }
