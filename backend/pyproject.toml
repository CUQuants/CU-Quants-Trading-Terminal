[project]
name = "cu-quants-trading-terminal-backend"
version = "0.1.0"
description = "FastAPI backend for the CU Quants Trading Terminal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "websockets>=14.0",
    "cuq-proxy-client[websocket]",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.uv.sources]
# Pinned to proxy-client main (v0.4.0, "added reporting client"). To pick up a
# newer SDK, bump `rev` and run `uv lock`. To develop against a local checkout
# instead, temporarily swap in:
#   cuq-proxy-client = { path = "../../proxy-client", editable = true }
cuq-proxy-client = { git = "https://github.com/CUQuants/proxy-client.git", rev = "aaa19e99138d6d2a7ec70bc052ec632d5e12cbb9" }
